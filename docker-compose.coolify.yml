services:
  # Coolify attaches every service to its per-resource network. Defining a
  # second network here can make the reverse proxy select an unreachable IP.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: napkey
      POSTGRES_USER: napkey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U napkey -d napkey"]
      interval: 5s
      timeout: 5s
      retries: 20

  kiro-go:
    build:
      context: ./backend/kiro-go
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/data/config.json
      ADMIN_PASSWORD: ${KIRO_ADMIN_PASSWORD_V2}
      ADMIN_HOST: ${KIRO_ADMIN_HOST:-}
      NAPKEY_CORE_URL: http://napkey-core:8081
      NAPKEY_INTERNAL_TOKEN: ${KIRO_ADMIN_PASSWORD_V2}
      # 9Router is the upstream. Set NINEROUTER_ENABLED=false only to fall back to the
      # local account pool. When neither upstream can serve, kiro-go still starts and
      # logs "No usable upstream" while refusing each request with a 503: an empty pool
      # is repaired through the admin panel this same container serves, so exiting would
      # remove the only way in. Treat that log line as a failed deploy.
      NINEROUTER_ENABLED: ${NINEROUTER_ENABLED:-true}
      NINEROUTER_RUNTIME_BASE_URL: ${NINEROUTER_RUNTIME_BASE_URL:-}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_CF_ACCESS_CLIENT_ID: ${NINEROUTER_CF_ACCESS_CLIENT_ID:-}
      NINEROUTER_CF_ACCESS_CLIENT_SECRET: ${NINEROUTER_CF_ACCESS_CLIENT_SECRET:-}
      NINEROUTER_TIMEOUT_MS: ${NINEROUTER_TIMEOUT_MS:-180000}
      # Defaults to Viberouter/ inside kiro-go when unset. A prefix naming a pool the
      # upstream does not serve fails every request, so verify it against /v1/models
      # before changing it.
      NINEROUTER_MODEL_PREFIX: ${NINEROUTER_MODEL_PREFIX:-Viberouter/}
      NINEROUTER_MODEL_MAP: ${NINEROUTER_MODEL_MAP:-}
    volumes:
      - kiro-data:/app/data
    expose: ["8080"]
    healthcheck:
      # 5s, not 15s: Docker runs the first check one interval after the container
      # starts, so a 15s interval leaves a container that is already serving marked
      # "starting" for a further 15 seconds. Coolify gives up before that and fails a
      # deploy whose services are all healthy -- exactly what happened on 2026-08-06,
      # when it abandoned napkey-core 4 seconds before its first check was due.
      # start_period keeps slow-start failures from burning retries.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  napkey-core:
    build:
      context: ./backend/napkey-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kiro-go:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://napkey:${POSTGRES_PASSWORD}@postgres:5432/napkey?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      SESSION_SECRET: ${SESSION_SECRET}
      TRIAL_FINGERPRINT_SECRET: ${TRIAL_FINGERPRINT_SECRET}
      SESSION_TTL: ${SESSION_TTL:-336h}
      SECURE_COOKIES: "true"
      PUBLIC_BASE_URL: https://napkey.io.vn
      KIRO_ADMIN_URL: http://kiro-go:8080
      KIRO_ADMIN_PASSWORD: ${KIRO_ADMIN_PASSWORD_V2}
      KIRO_SYNC_INTERVAL: ${KIRO_SYNC_INTERVAL:-60s}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_TOKEN_TTL: ${EMAIL_TOKEN_TTL:-24h}
      DEFAULT_TOKEN_LIMIT: ${DEFAULT_TOKEN_LIMIT:-0}
      DEFAULT_CREDIT_LIMIT: ${DEFAULT_CREDIT_LIMIT:-0}
      MAX_KEYS_PER_USER: ${MAX_KEYS_PER_USER:-10}
      CASSO_WEBHOOK_SECRET: ${CASSO_WEBHOOK_SECRET}
      CASSO_API_KEY: ${CASSO_API_KEY}
      BANK_NAME: ${BANK_NAME}
      BANK_BIN: ${BANK_BIN}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME}
      WALLET_HOLD_VND: ${WALLET_HOLD_VND:-1000000}
      # Google sign-in. Leave both blank to keep the console on email and password;
      # napkey-core refuses to start with only one of the pair set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    expose: ["8081"]
    healthcheck:
      # 5s, not 15s: Docker runs the first check one interval after the container
      # starts, so a 15s interval leaves a container that is already serving marked
      # "starting" for a further 15 seconds. Coolify gives up before that and fails a
      # deploy whose services are all healthy -- exactly what happened on 2026-08-06,
      # when it abandoned napkey-core 4 seconds before its first check was due.
      # start_period keeps slow-start failures from burning retries.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  napkey-web:
    build:
      context: ./napkey-web
      args:
        NEXT_PUBLIC_SITE_URL: https://napkey.io.vn
        NEXT_PUBLIC_API_BASE_URL: https://api.napkey.io.vn
    restart: unless-stopped
    depends_on:
      napkey-core:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NAPKEY_CORE_URL: http://napkey-core:8081
      NEXT_PUBLIC_SITE_URL: https://napkey.io.vn
      NEXT_PUBLIC_API_BASE_URL: https://api.napkey.io.vn
    expose: ["3000"]
    healthcheck:
      # 5s, not 15s: Docker runs the first check one interval after the container
      # starts, so a 15s interval leaves a container that is already serving marked
      # "starting" for a further 15 seconds. Coolify gives up before that and fails a
      # deploy whose services are all healthy -- exactly what happened on 2026-08-06,
      # when it abandoned napkey-core 4 seconds before its first check was due.
      # start_period keeps slow-start failures from burning retries.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/vi >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  kiro-data:
