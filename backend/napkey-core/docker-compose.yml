# Local development stack. Production runs on Coolify, where Postgres is a managed
# database service and these values come from the app environment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: napkey
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: napkey
    volumes:
      - napkey-pgdata:/var/lib/postgresql/data
    # Bound to localhost only. A Postgres reachable from the internet is a
    # database that will be found.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U napkey -d napkey"]
      interval: 5s
      timeout: 5s
      retries: 10

  napkey-core:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://napkey:localdev@postgres:5432/napkey?sslmode=disable
      # Development only. Generate a real one for any deployed environment.
      SESSION_SECRET: local-development-secret-at-least-32-bytes-long
      SECURE_COOKIES: "false"
      PUBLIC_BASE_URL: http://localhost:3000
      KIRO_ADMIN_URL: ${KIRO_ADMIN_URL:-http://host.docker.internal:8080}
      KIRO_ADMIN_PASSWORD: ${KIRO_ADMIN_PASSWORD:-changeme-locally}
      MAIL_PROVIDER: log
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CASSO_WEBHOOK_SECRET: ${CASSO_WEBHOOK_SECRET:-}
      CASSO_API_KEY: ${CASSO_API_KEY:-}
      BANK_NAME: ${BANK_NAME:-}
      BANK_BIN: ${BANK_BIN:-}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      WALLET_HOLD_VND: ${WALLET_HOLD_VND:-1000000}
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

volumes:
  napkey-pgdata:
